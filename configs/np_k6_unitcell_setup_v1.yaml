branch_id: NP-K6-MDC-V1
stage_id: NP-K6-MDC-P1-B
backend: periodic FDTD
local_pitch_x_nm: 290
period_y_nm: 290
propagation: SiO2 -> Air, +z
wavelength_library_nm: [448, 450, 453]
polarization_library: [x, y]
setup_gate: {wavelength_nm: 450, polarization: x}
materials:
  pillar_canonical_id: APCD_TIO2_NATIVE_M1
  substrate_canonical_id: APCD_SIO2_NATIVE_M1
  material_policy_json: configs/mdc_defect_450_material_policy.json
  material_reference_yaml: configs/material_reference_apcd_blue.yaml
  material_reference_json: configs/material_reference_apcd_blue.json
  sampled_material_csv: outputs/material_reference/mdc_blue_oujizi_m/material_ref_native_sampled_mdc_native_m1.csv
geometry:
  test_height_nm: 500
  test_diameter_nm: 160
  integer_nm_required: true
  independent_sio2_spacer: forbidden
layout_nm:
  interface_z_nm: 0
  fdtd_z_min_nm: -1000
  fdtd_z_max_nm: 1200
  source_z_nm: -500
  reflection_monitor_z_nm: -750
  transmission_monitor_z_nm: 900
  mesh_override_z_min_nm: -20
  mesh_override_z_max_nm: 720
  mesh_nm: 5
boundary_conditions: {x: Periodic, y: Periodic, z_min: PML, z_max: PML}
extraction:
  weighted_G0: forbidden
  normalization: blank_reference_direct_zero_order_complex_amplitude
  phase_convention: phase_rel = arg(t_candidate / t_blank)
blank_pillar_shared_region_source_monitor_reference_planes: true
fabrication_gates:
  diameter_nm: {min: 100, max: 230}
  height_nm: {min: 300, max: 700}
  minimum_edge_to_edge_gap_nm: 60
  maximum_aspect_ratio: 5.5